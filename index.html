<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Resizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>AI Image Resizer</h1>
        <p class="subtitle">Deep Learning Powered Image Resize Service</p>

        <div class="card">
            <h2>1. Upload Image</h2>
            <div class="dropzone" id="dropzone">
                <p>Click or Drag & Drop image here</p>
                <input type="file" id="fileInput" accept="image/*">
            </div>
            <img id="preview" style="display:none; max-width:100%; margin-top:15px; border-radius:8px;">
            <p id="imgInfo" style="color:#94a3b8; font-size:0.9rem;"></p>
        </div>

        <div class="card">
            <h2>2. Resize Settings</h2>

            <label>Mode</label>
            <select id="mode">
                <option value="smart">Smart Resize</option>
                <option value="super_resolution">Super Resolution (Upscale)</option>
                <option value="percentage">Scale by Factor</option>
                <option value="exact">Exact Size</option>
            </select>

            <label>Scale Factor (for Super Res / Percentage)</label>
            <select id="scale">
                <option value="0.5">0.5x (smaller)</option>
                <option value="1">1x (same)</option>
                <option value="2" selected>2x (double)</option>
                <option value="3">3x</option>
                <option value="4">4x</option>
            </select>

            <label>Width (px) — leave empty for auto</label>
            <input type="number" id="width" placeholder="e.g. 800">

            <label>Height (px) — leave empty for auto</label>
            <input type="number" id="height" placeholder="e.g. 600">

            <label>Output Format</label>
            <select id="format">
                <option value="png">PNG</option>
                <option value="jpg">JPG</option>
                <option value="webp">WebP</option>
            </select>

            <br><br>
            <button id="btn" disabled>Resize Image</button>
        </div>

        <div class="card" id="resultCard" style="display:none;">
            <h2>3. Result</h2>
            <div class="compare">
                <div>
                    <p>Original</p>
                    <img id="origResult">
                    <p id="origStats"></p>
                </div>
                <div>
                    <p>Resized</p>
                    <img id="newResult">
                    <p id="newStats"></p>
                </div>
            </div>
            <p id="procInfo"></p>
            <a id="downloadLink" download>
                <button type="button">Download Resized Image</button>
            </a>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
